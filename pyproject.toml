[project]
name = "github-webhooks"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "szerming", email = "szerming@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.143.0",
    "loguru>=0.7.3",
    "pydantic>=2.14.0",
    "uvicorn>=0.54.0",
]

[project.scripts]
github-webhooks = "github_webhooks:main"

[build-system]
requires = ["uv_build>=0.11.18,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
